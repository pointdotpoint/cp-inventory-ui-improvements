# Wardrobe UI Improvements: English texts, the list of every name.
# Format (the same as a player's override file, a TweakXL flat per text):
#   WUI_Loc.<lang>.<Name>: "text"
# {0}, {1}... are filled in by the mod; a translation keeps the same ones.
# tools/gen_localization.py turns these files into WardrobeTabsLocalizationTexts.reds.
#
# Adding a shipped translation: copy this file to <lang>.yaml (a game language code, e.g. de-de),
# replace "en-us" with that code on every line and translate the quoted texts; leave out any
# line you don't translate (it shows English). A player's override file in this format can be
# copied in as it is. Then run tools/gen_localization.py. How players use these lines without
# touching the mod: the comment at the top of WardrobeTabsLocalization.reds.
#
# The game shows every label in capitals. "Room" notes give the space a label has in Latin
# letters (CJK characters take about twice the width each); a longer text spills past its button.

# Body areas: area tabs (room: 6 letters, plus " (12)" while searching) and body column groups.
WUI_Loc.en-us.Area-Head: "HEAD"
WUI_Loc.en-us.Area-Body: "BODY"
WUI_Loc.en-us.Area-Arms: "ARMS"
WUI_Loc.en-us.Area-Legs: "LEGS"
WUI_Loc.en-us.Area-Feet: "FEET"
WUI_Loc.en-us.Area-Other: "OTHER"

